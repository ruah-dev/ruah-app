# Release: a tag v<version> (matching package.json "version") builds the macOS
# arm64 .dmg on a GitHub-hosted Apple silicon runner and attaches it, with a
# SHA256SUMS.txt, to a DRAFT GitHub Release. Check the draft, then publish it.
# "Run workflow" (workflow_dispatch) builds the same .dmg as a workflow artifact
# only (no release): a dry run.
#
# Signing is optional. Without secrets the app is ad-hoc signed (README "Install":
# first launch needs "Open Anyway"). With them it is Developer ID signed and, when
# the Apple API key is present too, notarized (scripts/macos/signing.cjs):
#
#   MAC_CERT_P12_BASE64   base64 of a "Developer ID Application" .p12  -> CSC_LINK
#   MAC_CERT_PASSWORD     its password                                 -> CSC_KEY_PASSWORD
#   APPLE_API_KEY_P8      contents of an App Store Connect API key .p8 -> APPLE_API_KEY (a file)
#   APPLE_API_KEY_ID      its key id                                   -> APPLE_API_KEY_ID
#   APPLE_API_ISSUER      its issuer id                                -> APPLE_API_ISSUER
#
# Least privilege: the build job (which runs install scripts and electron-builder)
# has a read-only token; only the small publish job, which runs no project code,
# may write releases. No dependency cache is used for release builds.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build the macOS dmg (arm64)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Bun (the viewer's package manager)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
          no-cache: true

      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          (cd ui && bun install --frozen-lockfile)

      - name: Gates
        run: |
          pnpm typecheck
          pnpm build
          pnpm test
          (cd ui && npx tsc --noEmit)

      # The .p12 and the .p8 are written to files under RUNNER_TEMP; only their
      # paths go into the environment of later steps (the password and ids are
      # given to the build step directly). Nothing is set when a secret is absent,
      # so electron-builder falls back to ad-hoc signing.
      - name: Signing and notarization (optional)
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "${MAC_CERT_P12_BASE64}" ]; then
            printf '%s' "${MAC_CERT_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/developer-id.p12"
            echo "CSC_LINK=${RUNNER_TEMP}/developer-id.p12" >> "${GITHUB_ENV}"
            echo "Signing: Developer ID (.p12 from secrets)"
            if [ -n "${APPLE_API_KEY_P8}" ]; then
              printf '%s\n' "${APPLE_API_KEY_P8}" > "${RUNNER_TEMP}/AuthKey.p8"
              echo "APPLE_API_KEY=${RUNNER_TEMP}/AuthKey.p8" >> "${GITHUB_ENV}"
              echo "Notarization: App Store Connect API key (needs APPLE_API_KEY_ID and APPLE_API_ISSUER too)"
            else
              echo "Notarization: off (no APPLE_API_KEY_P8 secret)"
            fi
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "${GITHUB_ENV}"
            echo "Signing: ad-hoc (no MAC_CERT_P12_BASE64 secret)"
          fi

      # pnpm dist = pnpm build && pnpm ui:build && electron-builder --mac --arm64;
      # its afterSign check runs the packaged daemon, a real pty and Claude's
      # bundled CLI before the .dmg is written. Never let electron-builder publish.
      - name: Build the dmg
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm dist --publish never

      - name: Checksums
        working-directory: release
        run: |
          shasum -a 256 ./*.dmg | sed 's# \./# #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Remove signing material
        if: always()
        run: rm -f "${RUNNER_TEMP}/developer-id.p12" "${RUNNER_TEMP}/AuthKey.p8"

      - name: Upload the dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruah-macos-arm64
          path: |
            release/*.dmg
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach to a draft GitHub Release
    needs: dmg
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the dmg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ruah-macos-arm64
          path: out

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" out/* --clobber
          else
            prerelease=""
            case "${TAG}" in *-*) prerelease="--prerelease" ;; esac
            gh release create "${TAG}" out/* --draft --verify-tag ${prerelease} \
              --title "Ruah ${TAG}" \
              --notes "macOS (Apple silicon) build. See CHANGELOG.md for what changed and README.md \"Install\" for first launch."
          fi
