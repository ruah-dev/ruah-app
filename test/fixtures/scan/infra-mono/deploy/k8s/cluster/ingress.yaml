apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public
  namespace: prod
spec:
  ingressClassName: nginx
  rules:
    - host: jobs.acme.dev
      http:
        paths:
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: worker-metrics
                port:
                  number: 9090
