services:
  api:
    build: ./api
    ports:
      - "3000:3000"   # http
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      - db
      - cache
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    depends_on:
      cache:
        condition: service_started
  db:
    image: postgres:16-alpine
    volumes: [pgdata:/var/lib/postgresql/data]
  cache:
    image: "redis:7"
    command: >
      redis-server
      --appendonly yes
volumes:
  pgdata: {}
